name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install Android SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew
          export BRIDGE_PYTHON="$(command -v python)"
          ./gradlew :app:assembleMobileDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: OKBOX-Android-Bridge-APKs
          path: app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
